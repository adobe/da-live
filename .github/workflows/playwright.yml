name: Playwright Tests (Da-Admin)
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both runs share the pw-<branch> test folder, so they must not overlap.
      max-parallel: 1
      matrix:
        include:
          - name: test
            browse: '1'
            script: test:all
            artifact: playwright
          - name: browse v2
            browse: '2'
            script: test:browse
            artifact: browse-v2
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: cd test/e2e && npm ci
    - name: Install Playwright Browsers
      run: cd test/e2e && npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        BROWSE: ${{ matrix.browse }}
      run: cd test/e2e && npm run ${{ matrix.script }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.artifact }}-report
        path: test/e2e/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.artifact }}-screenshots
        path: test/e2e/.playwright/shots/
        retention-days: 30
