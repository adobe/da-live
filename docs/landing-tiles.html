<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing tile component examples</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../blocks/landing/tiles.css">
  <script type="importmap">
    { "imports": { "da-lit": "/deps/lit/dist/index.js" } }
  </script>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      container-type: inline-size;
      max-width: 1068px;
      margin: 0 auto;
      padding: var(--s2-spacing-400);
      background: var(--s2-gray-25);
      color: var(--s2-gray-900);
      font-family: var(--s2-font-family);
      line-height: var(--s2-body-line-height);
    }

    h1 {
      font-size: var(--s2-heading-size-s);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--s2-spacing-300);
      margin-block: var(--s2-spacing-400);
    }

    fieldset {
      display: flex;
      gap: var(--s2-spacing-300);
      border: 1px solid var(--s2-gray-300);
      border-radius: var(--s2-corner-radius-200);
    }

    da-landing-tile:not(:defined) {
      visibility: hidden;
    }
  </style>
</head>
<body>
  <main>
    <h1>Landing tile component examples</h1>
    <p>Standalone component reference, not the landing page. Links open documentation;
      action examples only update the status below. No content is created.</p>
    <div class="controls">
      <fieldset>
        <legend>Color scheme</legend>
        <label><input type="radio" name="theme" value="light" checked> Light</label>
        <label><input type="radio" name="theme" value="dark"> Dark</label>
      </fieldset>
      <fieldset>
        <legend>Component size</legend>
        <label><input type="radio" name="size" value="s" checked> S</label>
        <label><input type="radio" name="size" value="m"> M</label>
      </fieldset>
    </div>
    <section class="landing-tiles" aria-label="Tile examples">
      <da-landing-tile heading="Develop &amp; Extend"
        description="Build custom fullscreen apps, library plugins, and automate via the Admin API"
        iconhref="/img/icons/S2_Icon_DataStreams_20_N.svg" actionid="develop"
        href="https://www.aem.live/developer/tutorial"></da-landing-tile>
      <da-landing-tile heading="Localization &amp; Multi-site" tone="purple"
        description="Translate, roll out to markets, and manage base/satellite site inheritance"
        iconhref="/img/icons/S2_Icon_ReportSuiteMapping_20_N.svg" actionid="localization"
        href="https://www.aem.live/docs/ew/administering/multi-site-manager"></da-landing-tile>
      <da-landing-tile heading="Action example" tone="green" action actionid="example"
        description="Activate with a click, Enter or Space. This example does not create content."
        iconhref="/img/icons/S2_Icon_DataStreams_20_N.svg"></da-landing-tile>
      <da-landing-tile heading="Disabled action" action disabled
        description="A native disabled button cannot be activated."
        iconhref="/img/icons/S2_Icon_DataStreams_20_N.svg"></da-landing-tile>
      <da-landing-tile heading="Display-only example" tone="orange"
        description="Without a destination or action, the tile is not interactive."
        iconhref="/img/icons/S2_Icon_ReportSuiteMapping_20_N.svg"></da-landing-tile>
    </section>
    <p id="status" role="status">Loading component examples...</p>
  </main>
  <script type="module">
    import { setNx, getNx2 } from '../scripts/utils.js';

    const status = document.querySelector('#status');
    try {
      setNx('/nx');
      await new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `${getNx2()}/styles/styles.css`;
        link.onload = resolve;
        link.onerror = () => reject(new Error('The Nexter stylesheet could not be loaded.'));
        document.head.append(link);
      });
      await import('../blocks/landing/tile.js');
      document.querySelector('.controls').addEventListener('change', ({ target }) => {
        if (target.name === 'theme') document.documentElement.style.colorScheme = target.value;
        if (target.name === 'size') {
          document.querySelectorAll('da-landing-tile').forEach((tile) => {
            tile.size = target.value;
          });
        }
      });
      document.querySelector('[actionid="example"]').addEventListener('click', () => {
        status.textContent = 'Example action activated. No content was created.';
      });
      status.textContent = 'Component examples ready.';
    } catch (error) {
      status.setAttribute('role', 'alert');
      status.textContent = `Could not load component examples: ${error.message}`;
    }
  </script>
</body>
</html>
