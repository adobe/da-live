<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Comparison test plugin</title>
  <style>
    body { margin:0; padding:20px; font:14px/1.5 system-ui; color:#292929; }
    h2 { font-size:20px; margin:8px 0; } p { color:#555; }
    label { display:block; margin:20px 0 6px; }
    textarea { box-sizing:border-box; width:100%; min-height:120px; border:1px solid #aaa; border-radius:8px; padding:10px; font:inherit; }
    button { border:1px solid #777; border-radius:20px; padding:8px 16px; background:white; font:inherit; cursor:pointer; }
    #status { font-size:12px; }
  </style>
</head>
<body>
  <h2>Independent test plugin</h2>
  <p>This plugin has no publishing workflow. It exercises the public comparison action.</p>
  <p id="page"></p>
  <button id="review">Review changes</button>
  <label for="note">Context to retain</label><textarea id="note" placeholder="Type a note, open comparison, and continue typing here."></textarea>
  <p id="status" role="status">Connecting…</p>
  <script type="module">
    import SDK from '/nx/utils/sdk.js';
    const { actions, context, capabilities } = await SDK;
    document.querySelector('#page').textContent = context.path;
    const candidate = new URLSearchParams(location.search).get('view') === 'approver' ? 'preview' : 'document';
    document.querySelector('#status').textContent = capabilities?.comparison === 1 ? 'Native comparison is available.' : 'This host does not support comparison.';
    document.querySelector('#review').onclick = async () => {
      const result = await actions.openComparison({ candidate, baseline: 'live' });
      document.querySelector('#status').textContent = result.ok ? 'Comparison open. This note and plugin instance are retained.' : result.error;
    };
  </script>
</body>
</html>
